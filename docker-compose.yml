version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./models:/app/models
      - ./results:/app/results

  dashboard:
    build: .
    ports:
      - "8501:8501"
    command: streamlit run streamlit_demo/app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - ./models:/app/models
      - ./results:/app/results
    depends_on:
      - api
